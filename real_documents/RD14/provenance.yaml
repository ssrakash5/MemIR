counterfactual_test:
  P1_alone: >
    States a generic "automation identity that lacks a Conditional Access
    policy" has notifications forwarded to a fake address -- does not
    name workload identities, managed identities, or service principals.
  B1_alone: >
    States workload identities (managed identities/service principals) are
    designed for automation and don't require MFA -- says nothing about
    notification forwarding or a fake address.
  composition: >
    Only together do P1 (the forwarding behavior for "automation
    identities") and B1 (workload identities are the automation-scenario
    identities) support the target claim that workload identities have
    their renewal notifications misdirected.
  distractors_cannot_compose: >
    The 9 distractor_pool entries are verbatim real text about MFA
    Conditional Access options and RBAC -- topically adjacent (same
    identity-security document) but none mentions notification
    forwarding or the fake address.
