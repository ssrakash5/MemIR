# Experiment design — generation/analysis split.
# Revised 2026-08-11 (second revision, same day) after review of the
# branching-graph grid: separates expensive trace-GENERATION factors from
# cheap post-hoc ANALYSIS factors, since depth and attribution_threshold
# don't change what the agent writes (this paper studies post-incident
# reconstruction, not an online MemLineage-style gate) -- they only change
# how a fixed execution trace gets read back. Corrects a 4x arithmetic
# error in the previous revision's factorial-size note (was claimed as
# 165,888; the axes as specified actually multiply to 41,472).
#
# Generated traces (the expensive axis): 4 x 3 x 4 x 4 x 3 x 3 = 1,728
# Depth x threshold analysis cells derivable from those traces: 1,728 x 6 x 4 = 41,472
# Containment-policy variants are a further post-hoc analysis layer on top
# of that, not another generation sweep.
#
# Pilot collapses from 48 executions to 8 actual generated traces:
#   top_k=5 x write_fanout=2 x 4 injection_styles x 2 transforms x
#   prompt_style=structured x seed=0 = 8. Generate each to max_depth=5,
#   then evaluate 3 depth horizons x 2 thresholds offline.

generation_factors:
  top_k: [1, 3, 5, 10]                # retrieval fan-out (memories retrieved per query)
  write_fanout: [1, 2, 3]             # write fan-out (new memories written per run)
  injection_style:                    # operational payload forms; mapping to MPBench's
    - direct_instruction               # taxonomy is pending full-text validation of that
    - embedded_fact                    # paper (see docs/prior_art.md -- MPBench is still an
    - authoritative_framing            # unverified second-hand extraction, unlike the four
    - multi_hop_setup                  # derivation_transform values below, which ARE
  derivation_transform:                # directly verified against MemLineage's own SS5.3.
    - summarize
    - paraphrase
    - refine
    - continue
  prompt_style: [terse, verbose, structured]  # renamed from summarization_prompt: it also
                                               # applies when derivation_transform is
                                               # paraphrase/refine/continue, where
                                               # "summarization prompt" was semantically odd.
  seeds: [0, 1, 2]                    # model/run stochasticity ONLY -- see scenario_id note below

generation_controls:
  max_depth: 5                        # hard external harness stop condition -- MUST NOT be
                                       # exposed to the agent in its prompt, so that the
                                       # depth-d prefix of a depth-5 trace is a valid
                                       # depth-d trace on its own (prefix property). One
                                       # pilot run must assert this property explicitly
                                       # before trusting the generation/analysis split.
  model: TBD                          # pin exact version string; see docs/preregistration.md
  embedding_model: TBD
  corpus_size: TBD

  # CRITICAL benchmark-design requirement, not optional: every generation
  # run's retrieved top_k must be constructed to include BOTH true
  # parents (structurally relevant to the compromised root) and
  # co-retrieved distractors (present in context, structurally
  # unrelated). If every retrieved memory always genuinely contributes to
  # every write, conservative provenance (retrieve-all -> parent-of-all)
  # has perfect precision by construction and the over-tainting phenomenon
  # this paper studies becomes unmeasurable by design. See the oracle
  # ground-truth schema in docs/labeling_protocol.md for how true parents
  # vs. distractors get labeled.
  distractor_requirement: "every generation run's context MUST mix true parents and co-retrieved distractors"

  # Pseudo-replication guard: if each injection_style corresponds to a
  # single hand-written payload and the 3 seeds just regenerate that same
  # scenario, the 3 seeds measure model/run stochasticity ONLY, not
  # generalization across independently constructed attack instances.
  # Either the corpus must supply multiple independently constructed
  # scenarios per injection_style (preferred -- add a scenario_id/
  # payload_id field to the generation schema and bootstrap CIs over
  # scenario_id, not over individual factorial cells), or this limitation
  # must be stated explicitly in docs/preregistration.md. Not yet decided
  # which -- open item.
  scenario_id_status: "UNDECIDED -- see pseudo-replication note above"

analysis_factors:
  # Both derived post-hoc from a single generated trace's persisted
  # (parent, child, attribution_score, run_id) edges -- no re-running the
  # LLM needed. attribution_threshold=null is conservative propagation
  # (recall=1 by construction, max inflation).
  depth: [0, 1, 2, 3, 4, 5]
  attribution_threshold: [null, 0.5, 0.7, 0.85]
  containment_policy: [flat_transitive, depth_aware]  # H4: one baseline, one proposed method -- do not add more yet

dependent_variables:
  # Blast-radius set notation (NOT edge notation -- see oracle ground
  # truth in docs/labeling_protocol.md for the separate edge-level
  # P_E/R_E metrics on attribution-edge quality, a related but distinct
  # measurement from blast-radius set reconstruction).
  - name: blast_radius_precision
    symbol: P_BR
    definition: "|B_flagged ∩ B_true| / |B_flagged|"
  - name: blast_radius_recall
    symbol: R_BR
    definition: "|B_flagged ∩ B_true| / |B_true|"
  - name: inflation_ratio
    definition: "|B_flagged| / |B_true|"
  - name: containment_cost
    symbol: C_regen
    definition: "count of unique generating runs that must be replayed to regenerate the quarantined set (not per-object cost -- if one run produced 3 exposed memories, that's 1 replay, not 3). Secondary metric: regeneration_tokens, if token usage is logged. Normalized form for H4: Regeneration Overhead = C_predicted / C_oracle."
  - name: surface_vs_execution_traceability
    definition: "H3 comparison: marker-token survival rate vs. execution-provenance recall, as a function of derivation_transform and depth. Operationalized via the oracle's TRUE_DESCENDANT + CLEAN node category (structurally descended from compromise, but no surviving surface marker) -- see docs/labeling_protocol.md."
  - name: attribution_edge_quality
    symbol: "P_E, R_E"
    definition: "precision/recall of inferred (parent, child) edges against the oracle's STRUCTURAL_PARENT vs. CO_RETRIEVED edge labels -- did we infer the right dependency edges, as distinct from did we reconstruct the right blast radius"

# depth=0 special case: at depth 0 the compromised root may have zero
# downstream descendants, giving |B_true|=0 and making recall/inflation
# undefined. Do NOT silently coerce to 0. Preregistered handling: report
# blast-radius precision/recall/inflation as N/A at any horizon where the
# oracle downstream blast radius is empty. Depth 0 is still kept in the
# analysis_factors list because it's useful for the surface-marker
# baseline and for harness validation, just not for these three metrics.

# Marginalization rule (preregistered estimand: BALANCED marginal means
# over the experimental distribution we defined, NOT real-world deployment
# prevalence -- we don't know the true prevalence of e.g. summarization
# vs. refinement in deployed agents). Average seeds within each cell
# first, then give every level of a marginalized factor equal weight
# regardless of how many samples/cells exist under it.
#
# H1 (over-tainting from graph growth): hold top_k x write_fanout x depth
#   explicit, attribution_threshold=null, marginalize equally over
#   injection_style x derivation_transform x prompt_style x seed. Report
#   P_BR/R_BR/inflation as functions of retrieval fan-out x write fan-out x depth.
#
# H2 (precision/recall frontier from attribution): hold attribution_threshold
#   x depth x top_k x write_fanout explicit, marginalize injection_style x
#   derivation_transform x prompt_style x seed. Report a FRONTIER, not a
#   collapsed single "best threshold" scalar -- distinct from MemLineage's
#   own tau x K / r_K result (see docs/positioning.md) because this is
#   about branching blast-radius reconstruction including false-positive
#   expansion, not their strong-edge-survival question.
#
# H3 (semantic laundering / traceability): hold derivation_transform x
#   depth explicit, attribution_threshold=null (conservative execution
#   provenance, not mixed with threshold choice), marginalize top_k x
#   write_fanout x injection_style x prompt_style x seed. Compare surface
#   marker survival vs. execution-provenance (oracle-based) traceability.
#
# H4 (containment): containment_policy is a post-hoc analysis factor
#   applied to each reconstructed graph -- no new traces needed. Compare
#   flat_transitive vs. depth_aware on quarantined_objects,
#   false_quarantined_objects, regenerated_runs (C_regen), and
#   Regeneration Overhead.
