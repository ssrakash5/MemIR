# Full factorial experiment grid.
# Revised 2026-08-11 to match the repositioned research question in
# docs/positioning.md: post-incident blast-radius reconstruction from a
# known-compromised memory in BRANCHING agent-memory graphs, not the
# original precision-of-exposure-flagging framing (which failed the
# Tuesday gate — see docs/positioning.md). This revision:
#   - adds a branching-factor axis (write_fanout) that the original grid
#     was missing entirely — the repositioned question is specifically
#     about branching graphs, and the old grid only varied retrieval
#     fan-out (top_k), not write fan-out.
#   - adds derivation_transform, matching MemLineage's own §5.3 vocabulary
#     (summarize/paraphrase/refine/continue) so H3 (execution-provenance
#     vs. surface-traceability) is directly comparable to their results.
#   - replaces dependent_variables with blast-radius framing (precision,
#     recall, inflation, containment cost) per docs/preregistration.md.
#
# `cell_type: pilot` cells run first (small N, fast turnaround) to
# sanity-check the harness before committing compute to `full` cells.
#
# Independent variables:
#   top_k                  — retrieval fan-out (memories retrieved per query)
#   write_fanout            — write fan-out (new memories written per run) — NEW
#   depth                  — derivation chain depth cap
#   attribution_threshold   — null means conservative propagation (recall=1 by construction, max inflation)
#   injection_style        — attack vocabulary / framing (source: MPBench taxonomy)
#   derivation_transform    — NEW: matches MemLineage §5.3 vocabulary for direct comparability
#   summarization_prompt   — tone/verbosity of the transform, orthogonal to derivation_transform
#
# Controls (held fixed within a run, varied only across explicit control sweeps):
#   model, seed, corpus_size, embedding_model

variables:
  top_k: [1, 3, 5, 10]
  write_fanout: [1, 2, 3]
  depth: [0, 1, 2, 3, 4, 5]
  attribution_threshold: [null, 0.5, 0.7, 0.85]
  injection_style:
    - direct_instruction
    - embedded_fact
    - authoritative_framing
    - multi_hop_setup
  derivation_transform: [summarize, paraphrase, refine, continue]
  summarization_prompt: [terse, verbose, structured]

controls:
  model: TBD               # pin exact version string once selected; see docs/preregistration.md
  embedding_model: TBD     # pin exact version string once selected
  corpus_size: TBD         # set alongside docs/labeling_protocol.md corpus decision
  seeds: [0, 1, 2]          # >=3 seeds per condition per CLAUDE.md standards

dependent_variables:
  - name: blast_radius_precision
    definition: "E_correct / E_flagged — fraction of flagged downstream objects that are actually exposed"
  - name: blast_radius_recall
    definition: "E_correct / E_true — fraction of actually-exposed downstream objects that get flagged"
  - name: inflation_ratio
    definition: "E_flagged / E_true — how much a conservative policy over-quarantines relative to ground truth"
  - name: containment_cost
    definition: "cost of the quarantine/regeneration implied by a given flagged set (definition TBD — needs a concrete cost model, e.g. # objects regenerated x regeneration cost, or just count for now)"
  - name: surface_vs_execution_traceability
    definition: "H3 comparison metric: marker-token survival rate vs. execution-provenance recall, as a function of derivation_transform and depth"

# Cell classification.
# - pilot: run first, small N, verifies the harness end-to-end and gives an
#   early read on whether the grid needs to shrink or the harness needs fixing.
# - full: the pre-registered factorial cells reported in the paper.
#
# Pilot slice: one mid-range value per axis, all injection styles (cheap,
# and injection_style is unlikely to have a "typical" value worth collapsing).
cells:
  pilot:
    top_k: [5]
    write_fanout: [2]
    depth: [0, 2, 4]
    attribution_threshold: [null, 0.7]
    injection_style: [direct_instruction, embedded_fact, authoritative_framing, multi_hop_setup]
    derivation_transform: [summarize, paraphrase]
    summarization_prompt: [structured]
    seeds: [0]

  full:
    top_k: [1, 3, 5, 10]
    write_fanout: [1, 2, 3]
    depth: [0, 1, 2, 3, 4, 5]
    attribution_threshold: [null, 0.5, 0.7, 0.85]
    injection_style:
      - direct_instruction
      - embedded_fact
      - authoritative_framing
      - multi_hop_setup
    derivation_transform: [summarize, paraphrase, refine, continue]
    summarization_prompt: [terse, verbose, structured]
    seeds: [0, 1, 2]

notes: |
  Full factorial size = 4 (top_k) x 3 (write_fanout) x 6 (depth)
  x 4 (attribution_threshold) x 4 (injection_style) x 4 (derivation_transform)
  x 3 (summarization_prompt) x 3 (seeds) = 165,888 cells.

  This is dramatically larger than the already-too-large 13,824-cell grid
  from before the repositioning (adding write_fanout and
  derivation_transform multiplied it by 12x). The marginalization decision
  flagged before the repositioning is now more urgent, not less — this is
  an open item for docs/preregistration.md, not resolved here.

  A reasonable starting point to propose (not a decision — needs sign-off):
  run the full top_k x write_fanout x depth x attribution_threshold sweep
  (4x3x6x4 = 288 cells) at ONE fixed injection_style x derivation_transform
  x summarization_prompt point, since that's the core of H1/H2/H4. Then run
  a separate, smaller injection_style x derivation_transform sweep (4x4=16
  cells) at one fixed point on the other axes, since that's what H3 needs.
  288 + 16 = 304 cells x 3 seeds = 912 runs, which is a very different
  scale than 165,888 and should be checked against actual per-run cost
  (API calls, latency) before committing to it either.
