distractor_pool:
  - id: D1
    text: "Traditional -- manually configured lifecycles and assignments of attributes (security and logging); static security policies and solutions that address one pillar at a time with discrete dependencies on external systems."
  - id: D2
    text: "Initial -- starting automation of attribute assignment and configuration of lifecycles, policy decisions and enforcement, and initial cross-pillar solutions with integration of external systems."
  - id: D3
    text: "Advanced -- wherever applicable, automated controls for lifecycle and assignment of configurations and policies with cross-pillar coordination; centralized visibility and identity control."
  - id: D4
    text: "Optimal -- fully automated, just-in-time lifecycles and assignments of attributes to assets and resources that self-report with dynamic policies based on automated/observed triggers."
  - id: D5
    text: "Subsections 0-5.5 provide high-level information to support agencies in transitioning to zero trust across the five different pillars: Identity, Devices, Networks, Applications and Workloads, and Data."
  - id: D6
    text: "Each pillar also includes general details regarding Visibility and Analytics, Automation and Orchestration, and Governance capabilities to support integration with that pillar and across the model."
