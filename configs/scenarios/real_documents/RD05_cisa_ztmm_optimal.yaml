    text: "These three cross-cutting capabilities highlight activities to support interoperability of functions across pillars."
  - id: D8
    text: "Figure 4 provides a high-level overview of the ZTMM, including key aspects of the pillar-specific functions for each pillar and across each maturity stage."
  - id: D9
    text: "Agencies should use the following guiding criteria of each stage to identify maturity for each zero trust technology pillar and provide consistency across the maturity model."
