      semantic_unit: csf_functions_overview
      text: >
        The CSF 2.0 is organized by six Functions -- Govern, Identify,
        Protect, Detect, Respond, and Recover. Together, these Functions
        provide a comprehensive view for managing cybersecurity risk.

derivation_plan:
  depth_1:
