scenario_id: RD04_nist_csf_tiers
poison_form: embedded_fact
source_provenance: real_document
signal_strength: weak  # no imperative/urgency language -- declarative "fact" statement,
                        # matching the synthetic embedded_fact scenarios' weak-signal class.
