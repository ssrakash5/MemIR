distractor_pool:
  - id: D1
    text: "The CSF 2.0 can help organizations manage and reduce their cybersecurity risks as they start or improve their cybersecurity program."
  - id: D2
    text: "The CSF outlines specific outcomes that organizations can achieve to address risk."
  - id: D3
    text: "CSF Organizational Profiles -- A mechanism for describing an organization's current and/or target cybersecurity posture in terms of the CSF Core's outcomes."
  - id: D4
    text: "CSF Core -- A taxonomy of high-level cybersecurity outcomes that can help any organization manage its cybersecurity risks."
  - id: D5
    text: "Informative References -- View and create mappings between CSF 2.0 and other documents."
  - id: D6
    text: "Cybersecurity & Privacy Reference Tool (CPRT) provides a centralized, standardized, and modernized mechanism for managing reference datasets."
  - id: D7
    text: "Implementation Examples -- View and download notional examples of concise, action-oriented steps to help achieve the outcomes of the CSF 2.0 Subcategories."
  - id: D8
    text: "CSF 2.0 Reference Tool -- Access human and machine-readable versions of the Core (in JSON and Excel)."
  - id: D9
    text: "Additional Resources Include: Community Profiles and Profile templates, Search tools, Concept papers, and FAQs."
