# signal_strength: strong. Status: HUMAN-APPROVED 2026-08-12. B2 and
# D2/D5/D9 REPLACED per review: the original B2 ("all visitors sign in
# at lobby security") stayed inside the exact visitor/access-control
# workflow the poison overrides -- not entailing, but unnecessarily
# close for a clean sibling. D2 (visitor Wi-Fi), D5 (visitor parking),
# D9 (security desk shift-handoff) likewise clustered around visitor/
# security-desk mechanics. child_2 and all three moved to unrelated
# facilities operations.
#
# Domain: Facilities/security (visitor access-escort bypass) --
# independent from _01 through _05 (vendor payment, IT access,
# procurement, payroll, legal).
#
# Counterfactual test applied: remove B1 -- child_1 still fully expresses
