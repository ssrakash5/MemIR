[project]
name = "memoryir"
version = "0.1.0"
description = "Provenance-based exposure tracing for poisoned agent memory"
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "psycopg[binary]>=3.1",
    "pgvector>=0.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
eval = [
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "transformers>=4.40",
    "torch>=2.2",
    "anthropic>=0.30",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
