[project]
name = "memoryir"
version = "0.1.0"
description = "Provenance-based exposure tracing for poisoned agent memory"
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "psycopg[binary]>=3.1",
    "pgvector>=0.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# Pinned to exact versions actually used to generate the corpus and
# compute every result in results/metrics/ (2026-08-16) -- per
# CLAUDE.md's "pin model versions" standard, extended to the dependency
# set itself: a floor (">=") does not guarantee the same corpus, labels,
# or metrics regenerate identically.
eval = [
    "scikit-learn==1.6.1",
    "scipy==1.15.3",
    "transformers==4.47.0",
    "torch==2.5.1",
    "anthropic>=0.30",
    "openai==1.63.0",
    "sentence-transformers==4.1.0",
    "truststore==0.10.4",
    "python-dotenv==1.0.1",
    "requests==2.34.2",
    "pandas==2.2.2",
    "matplotlib==3.9.2",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
